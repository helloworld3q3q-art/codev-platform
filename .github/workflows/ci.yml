name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: ruff (codev_platform)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install ruff
        run: pip install ruff

      # Phase 1 逐步收敛: 先 gate 产品代码 codev_platform (规则/ignore 见 pyproject [tool.ruff])。
      # tests/ + tools/ + scripts/ 留 Phase 2 (E501 行长全仓暂缓)。
      - name: Ruff check
        run: python -m ruff check codev_platform

  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ['3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable, no runtime extras)
        run: pip install -e .

      - name: Install pytest
        run: pip install pytest pytest-timeout

      - name: Run tests
        # --timeout: 单测墙钟上限, 防个别用例挂死 (如插件全仓扫描进大目录) 静默堵住整个 CI。
        # thread 方法跨平台一致 (signal 仅 Unix; CI 含 windows/macos)。
        run: python -m pytest tests/ -q --timeout=120 --timeout-method=thread
