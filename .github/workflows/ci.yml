name: CI

# 适配自建 Gitea + act_runner(host 模式, WSL Linux)。不碰 github.com + 不每次下载工具:
#   - checkout: 手动 git fetch 本地 Gitea(注入 GITHUB_TOKEN), 不用 actions/checkout
#   - 工具:    用 WSL 预装的 ~/ci-venv(ruff/pytest/detect-secrets, 一次装好零下载)
#   - 代码:    PYTHONPATH 指向 checkout, 不装包(base 零依赖)
#   - runner:  单 ubuntu-latest:host(win/mac 无 runner)
# 注: GitHub 上不跑此 workflow(仅 GitHub 备份代码)。
# 维护: 工具升级时在 WSL 重建 ~/ci-venv(pip install -i 清华镜像 ruff==x pytest pytest-timeout detect-secrets)。

on:
  push:
  pull_request:

# 同分支新 push 自动取消进行中的旧 run, 防积压(host runner 单线程, 旧 task 卡队列)。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff (codev_platform)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (本地 Gitea, 不碰 github)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q .
          git remote add origin "http://x-access-token:${TOKEN}@localhost:3000/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch -q --depth=1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      - name: Ruff check (预装 ci-venv, 零下载)
        run: |
          "$HOME/ci-venv/bin/ruff" check codev_platform

  test:
    name: pytest (ubuntu / 预装 ci-venv)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (本地 Gitea)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q .
          git remote add origin "http://x-access-token:${TOKEN}@localhost:3000/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch -q --depth=1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      - name: pytest (预装 ci-venv + PYTHONPATH, 零下载)
        # 含 provider 文件纪律 + 测试数地板(防自挂盲区复发)。codev_platform base 零依赖, 走 PYTHONPATH 不装包。
        run: |
          PYTHONPATH="$PWD" "$HOME/ci-venv/bin/python" -m pytest tests/ -q --timeout=120 --timeout-method=thread

  commit-lint:
    name: commit message (no AI traces)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout (本地 Gitea, 全历史)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q .
          git remote add origin "http://x-access-token:${TOKEN}@localhost:3000/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch -q origin
          git checkout -q "${GITHUB_SHA}"
      - name: Scan PR commit messages
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          if git log --format=%B "$base..$head" \
              | grep -iEn 'co-authored-by:.*(claude|opus|sonnet|anthropic)|generated with .*claude|🤖 generated|noreply@anthropic'; then
            echo "::error::commit message 含 AI 痕迹 (见 commit-pr-conventions.md), 请 amend 去掉"
            exit 1
          fi
          echo "OK: PR commit message 无 AI 痕迹"

  secrets:
    name: secret scan (detect-secrets)
    runs-on: ubuntu-latest
    # 报告型起步(continue-on-error): host 无 docker, 用预装 detect-secrets 替代 gitleaks。
    continue-on-error: true
    steps:
      - name: Checkout (本地 Gitea)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q .
          git remote add origin "http://x-access-token:${TOKEN}@localhost:3000/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch -q --depth=1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      - name: detect-secrets scan (预装 ci-venv)
        run: |
          "$HOME/ci-venv/bin/detect-secrets" scan --exclude-files 'tests/|docs/audits/|.*\.lock$' > /tmp/ds.json
          "$HOME/ci-venv/bin/python" -c "import json; d=json.load(open('/tmp/ds.json')); n=sum(len(v) for v in d.get('results',{}).values()); print('detect-secrets potential findings:', n); raise SystemExit(1 if n else 0)"

  # web-ui 前端不进 CI: 前端不写测试用例, tsc/lint 静态检查由本地/IDE 负责(用户决定不在 CI 跑)。
