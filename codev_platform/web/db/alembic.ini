# Alembic config for codev-platform web business DB (RBAC/account 7 tables).
#
# Schema single source of truth = codev_platform/web/db/tables.py (metadata).
# This file only configures the migration tooling; the real DSN is resolved at
# runtime by env.py from core.config (env CODEV_PLATFORM_MEMORY_DSN > memory.pg_dsn).
# The sqlalchemy.url below is a placeholder used only for offline/no-DSN cases.
#
# Invoke from repo root:
#   python -m alembic -c codev_platform/web/db/alembic.ini history
#   python -m alembic -c codev_platform/web/db/alembic.ini upgrade head   # needs real PG
#   python -m alembic -c codev_platform/web/db/alembic.ini stamp head     # existing live DB

[alembic]
# Path to migration scripts, relative to this ini file's directory.
script_location = %(here)s/alembic

# Template used to generate migration file names.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Timezone for migration timestamps. Empty = naive UTC.
timezone =

# Placeholder DSN. env.py overrides this from core.config at runtime; this
# value is only a fallback so `history`/`heads`/`check --help` parse offline.
# A real PG connection is NOT required to inspect scripts or run offline.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# No autoformatting hooks wired (kept minimal / ASCII).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
