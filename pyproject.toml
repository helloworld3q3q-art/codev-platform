[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codev-platform"
version = "0.1.0"
description = "Multi-project AI 协作工具栈基础设施 (project_id resolver + paths + CLI)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "helloworld3q3q-art" }]
license = { text = "Proprietary" }
dependencies = []

# 重运行时依赖(daemon / 索引器 / MCP server 实际运行所需)。
# base dependencies 保持 []，默认安装仍是 0 依赖纯源码包(可作 thin shim 装进任意业务仓)。
# 全量自立模式：在 codev-platform 自建 venv 跑 `pip install -e .[runtime]` 拉下面这些。
# 注意：sentence-transformers 会拉 torch；CUDA 版 torch 需用对应 index-url 单独装
#       (例 `pip install torch --index-url https://download.pytorch.org/whl/cu124`)。
[project.optional-dependencies]
runtime = [
    "chromadb>=1.5.9",
    "sentence-transformers>=5.5.1",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "mcp-proxy>=0.12.0",
    "watchfiles>=1.2.0",
    "websockets>=16.0",
    "httptools>=0.7.1",
    "cryptography>=48.0.0",
]
# dev: 纯逻辑单测 + 超时保护 + lint。不拉 runtime 重依赖(torch/chromadb)。
# pytest-timeout: 单测墙钟上限, 防个别用例挂死 (如插件全仓扫描) 静默堵住整个 CI。
# ruff: lint (规则见 [tool.ruff]; Phase 1 gate codev_platform)。
dev = ["pytest>=7", "pytest-timeout>=2", "ruff>=0.15"]
# agent: HTTP 服务 + LLM provider + search_docs 的 MCP client。
# Claude 必装;openai 供 GPT/DeepSeek/Qwen 共用;mcp 供 search_docs 工具连 chroma daemon
# (SSE client)—— 漏了它 search_docs 会 ModuleNotFoundError(codegraph/graph 走 sqlite 不受影响)。
agent = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "anthropic>=0.40.0",
    "openai>=1.55.0",
    "pydantic>=2.0",
    "mcp>=1.0.0",
    "psycopg[binary,pool]>=3.2",
    # web 业务 PG 库走 SQLAlchemy Core(account_store_pg / rbac_store_pg)+ Alembic migration。
    # 与 psycopg 同属 PG 栈;无 PG 部署不装 .[agent] 时,store 优雅回退内存(不影响 0 依赖纯源码包)。
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# ruff lint —— 分阶段引入 (codev-platform-audit P2)。Phase 1 先开真实 bug / 过时写法 / bugbear,
# E501 行长 (1356 处历史项) + E402 (本仓刻意大量用条件/晚 import) 暂缓, 后续逐步收敛再开。
[tool.ruff]
target-version = "py310"   # 对齐 requires-python >=3.10
line-length = 100

[tool.ruff.lint]
select = ["F", "E", "W", "UP", "B"]
ignore = [
    "E501",  # line-too-long: 1356 处历史项, Phase 2 逐步收敛再开
    "E402",  # module-import-not-at-top: 本仓刻意大量条件/晚 import, 非 bug
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖注入默认值 (Depends/Query/...) 是正确惯用法, 不是 B008 可变默认调用 bug。
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header",
    "fastapi.Cookie", "fastapi.Body", "fastapi.Form", "fastapi.File",
]

[tool.ruff.lint.per-file-ignores]
# 拆分后的 re-export hub: 故意 re-import 子模块符号对外暴露 (业务仓 shim / 对外 import 路径不变), F401 不适用。
"codev_platform/chroma/server.py" = ["F401", "F811"]
"codev_platform/mcp_serve.py" = ["F401"]
# sql.py 1254 行 -> sql/ 包 (ddl/orm/core 分文件), __init__ re-export 全部子模块符号保对外路径不变。
"codev_platform/plugins/builtin/sql/__init__.py" = ["F401"]

[project.scripts]
codev-platform = "codev_platform.cli:main"

[project.urls]
repository = "https://github.com/helloworld3q3q-art/codev-platform"

[tool.setuptools.packages.find]
where = ["."]
include = ["codev_platform*"]
exclude = ["platform_meta*", "docs*", "tests*"]

# 真值源 rules / skills 现在包内 codev_platform/resources/ —— 作为 package-data 打进 wheel,
# 普通 pip 安装(非 editable)后 sync-rules / sync-skills 才能找到源(audit-0601 #2)。
[tool.setuptools.package-data]
codev_platform = ["resources/**/*.md", "resources/**/*"]
